mode: rule
ipv6: false
log-level: silent
allow-lan: false
tproxy-port: 7894
unified-delay: true
tcp-concurrent: true
external-controller: 0.0.0.0:9090
external-ui: ./ui
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip"

dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  fake-ip-range: 198.18.0.1/16
  direct-nameserver:
    - 8.8.8.8
    - 8.8.4.4
    - 77.88.8.8
    - 77.88.8.1
    - 195.208.4.1
  nameserver:
    - https://dns.google/dns-query
    - 8.8.8.8
    - 8.8.4.4
    - 1.1.1.1
  default-nameserver:
    - 8.8.8.8
    - 8.8.4.4
    - 1.1.1.1
  proxy-server-nameserver:
    - 8.8.8.8
    - 8.8.4.4
    - 1.1.1.1
    - tls://77.88.8.8 
  fallback:
    - 9.9.9.9    
    - 208.67.222.222 

  nameserver-timeout: 3000       
  default-nameserver-timeout: 3000 
    
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '*.lan'
    - '*.localdomain'
    - '*.example'
    - '*.invalid'
    - '*.localhost'
    - '*.test'
    - '*.local'
    - '*.home.arpa'
    - 'router.asus.com'
    - 'cudy.net'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - '+.3gppnetwork.org'
    - 'knpd.nalog.ru'
keep-alive-idle: 15
keep-alive-interval: 15
profile:
  store-selected: true 
  store-fake-ip: true 
  tracing: false
routing-mark: 2 
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - '+.lan'
    - '+.local'
    - '+.push.apple.com'
    - '+.apple.com'

proxy-providers:
  burunyaVPN_bot: 
    type: http
    url: ""
    path: ./proxy_providers/burunyaVPN_bot.yaml 
    interval: 86400 
    proxy: DIRECT 
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204 
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: 204
    override:
      skip-cert-verify: true
    header:
      User-Agent: [Nikki]
      x-hwid: [Router]
      x-device-os: [OpenWrt]
      x-ver-os: [24]
      x-device-model: [XRouter]
proxy-groups:
  - name: PROXY
    type: url-test
    include-all: true
    url: http://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 300
    tolerance: 50
    lazy: true
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available_1.png
    use:
      - burunyaVPN_bot


